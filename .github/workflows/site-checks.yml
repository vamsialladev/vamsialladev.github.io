name: Site checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pages, sitemap and feed match data/site.json
        run: python scripts/site_sync.py --check
      - name: Feed and sitemap are well-formed
        run: python scripts/site_sync.py --validate
      - name: Validate HTML
        run: npx --yes html-validate@9.7.1 "*.html" "projects/*.html" "notes/*.html"
      - name: Internal links and assets (must pass)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --root-dir "${{ github.workspace }}" "*.html" "projects/*.html" "notes/*.html"
          fail: true
      - name: External links (warning only)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress --root-dir "${{ github.workspace }}" --scheme https --cookie-jar lychee-cookies.json --max-retries 3 --accept "200..=299,403,429,503,999" --exclude "^https://(www\.)?linkedin\.com" --exclude "^https://vamsialla\.com" "*.html" "projects/*.html" "notes/*.html"
          fail: false

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
