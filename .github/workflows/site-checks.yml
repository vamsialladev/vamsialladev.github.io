name: Site checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate HTML
        run: npx --yes html-validate@9.7.1 "*.html" "projects/*.html" "notes/*.html"
      - name: Internal links and assets (must pass)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --root-dir "${{ github.workspace }}" "*.html" "projects/*.html" "notes/*.html"
          fail: true
      - name: External links (warning only)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress --scheme https --max-retries 2 --accept "200..=299,403,429,999" --exclude "^https://(www\.)?linkedin\.com" --exclude "^https://vamsialla\.com" "*.html" "projects/*.html" "notes/*.html"
          fail: false
